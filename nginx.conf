server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Direct links remain readable. Keep HTML, PDFs and text summaries out of search.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
